<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型库 - OpenCV Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/models.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="/static/company-logo.png" alt="Logo" style="height: 40px; object-fit: contain;">
                <a href="/" class="navbar-brand">OpenCV Platform</a>
            </div>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">首页</a></li>
                <li><a href="/inference" class="nav-link">在线推理</a></li>
                <li><a href="/training" class="nav-link">模型训练</a></li>
                <li><a href="/models" class="nav-link active">模型库</a></li>
                <li><a href="/projects" class="nav-link">项目管理</a></li>
                <li><a href="/datasets" class="nav-link">数据集</a></li>
                <li><a href="/annotation" class="nav-link">数据标注</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <!-- 页面标题和操作栏 -->
        <div class="page-header">
            <div class="page-title">
                <h1>模型库</h1>
                <p class="subtitle">管理您的 YOLO 模型，支持上传、预览和部署</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showUploadModal()">上传模型</button>
                <div class="view-toggle">
                    <button class="btn btn-icon active" onclick="setView('grid')" title="网格视图">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    </button>
                    <button class="btn btn-icon" onclick="setView('list')" title="列表视图">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4"/><rect x="3" y="10" width="18" height="4"/><rect x="3" y="16" width="18" height="4"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 搜索和筛选栏 -->
        <div class="filter-bar">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索模型..." oninput="filterModels()">
            </div>
            <div class="filter-group">
                <select id="taskFilter" onchange="filterModels()">
                    <option value="">全部任务</option>
                    <option value="detect">目标检测</option>
                    <option value="segment">实例分割</option>
                    <option value="pose">姿态估计</option>
                    <option value="classify">图像分类</option>
                    <option value="obb">旋转检测</option>
                </select>
                <select id="projectFilter" onchange="filterModels()">
                    <option value="">全部项目</option>
                </select>
                <select id="sortFilter" onchange="filterModels()">
                    <option value="newest">最新</option>
                    <option value="oldest">最早</option>
                    <option value="size">大小</option>
                    <option value="name">名称</option>
                </select>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="totalModels">0</div>
                <div class="stat-label">模型</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDetect">0</div>
                <div class="stat-label">检测</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSegment">0</div>
                <div class="stat-label">分割</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPose">0</div>
                <div class="stat-label">姿态</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalClassify">0</div>
                <div class="stat-label">分类</div>
            </div>
        </div>

        <!-- 模型卡片网格 -->
        <div id="modelsGrid" class="models-grid">
            <!-- 模型卡片将动态加载 -->
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <h3>暂无模型</h3>
            <p>上传您的第一个 YOLO 模型开始使用</p>
            <button class="btn btn-primary" onclick="showUploadModal()">上传模型</button>
        </div>

        <!-- 加载状态 -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>正在加载模型...</p>
        </div>
    </div>

    <!-- 上传模态框 -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>上传模型</h2>
                <button class="close-btn" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="uploadArea">
                    <p class="upload-text">拖拽模型文件到此处或点击选择</p>
                    <p class="upload-hint">支持 .pt 格式</p>
                    <input type="file" id="modelFile" accept=".pt" hidden>
                    <button class="btn btn-secondary" onclick="document.getElementById('modelFile').click()">
                        选择文件
                    </button>
                </div>

                <div id="uploadPreview" class="upload-preview" style="display: none;">
                    <div class="preview-info">
                        <span class="preview-name" id="previewName"></span>
                        <span class="preview-size" id="previewSize"></span>
                    </div>
                    <button class="btn btn-icon" onclick="clearUpload()" title="移除">&times;</button>
                </div>

                <div class="upload-form">
                    <div class="form-group">
                        <label>模型名称</label>
                        <input type="text" id="modelName" placeholder="自动从文件名提取">
                    </div>
                    <div class="form-group">
                        <label>所属项目</label>
                        <select id="uploadProject">
                            <option value="">不关联项目（公共模型）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>描述（可选）</label>
                        <textarea id="modelDescription" rows="3" placeholder="添加模型描述..."></textarea>
                    </div>
                </div>

                <div id="uploadProgress" class="upload-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>

                <div id="uploadResult" class="upload-result" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeUploadModal()">取消</button>
                <button class="btn btn-primary" id="uploadBtn" onclick="uploadModel()" disabled>
                    上传
                </button>
            </div>
        </div>
    </div>

    <!-- 模型详情预览 -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2 id="detailTitle">模型详情</h2>
                <button class="close-btn" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detailContent">
                <!-- 模型详情将动态加载 -->
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要删除模型 "<span id="deleteModelName"></span>" 吗？</p>
                <p class="warning-text">此操作不可撤销，模型文件将被删除。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        // 全局状态
        let models = [];
        let filteredModels = [];
        let currentView = 'grid';
        let deleteModelId = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadModels();
            loadProjects();
            initUploadArea();
        });

        // 加载模型列表
        async function loadModels() {
            showLoading();
            try {
                const response = await API.get('/api/v1/models');
                if (response.success) {
                    models = response.models || [];
                    updateStats();
                    filterModels();
                }
            } catch (error) {
                console.error('加载模型失败:', error);
                showEmpty();
            }
            hideLoading();
        }

        // 加载项目列表
        async function loadProjects() {
            try {
                const response = await API.get('/api/v1/projects');
                if (response.success) {
                    const options = response.projects.map(p =>
                        `<option value="${p.id}">${p.name}</option>`
                    ).join('');
                    document.getElementById('projectFilter').innerHTML =
                        '<option value="">全部项目</option>' + options;
                    document.getElementById('uploadProject').innerHTML =
                        '<option value="">不关联项目（公共模型）</option>' + options;
                }
            } catch (error) {
                console.error('加载项目失败:', error);
            }
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('totalModels').textContent = models.length;
            document.getElementById('totalDetect').textContent =
                models.filter(m => m.task === 'detect').length;
            document.getElementById('totalSegment').textContent =
                models.filter(m => m.task === 'segment').length;
            document.getElementById('totalPose').textContent =
                models.filter(m => m.task === 'pose').length;
            document.getElementById('totalClassify').textContent =
                models.filter(m => m.task === 'classify').length;
        }

        // 筛选模型
        function filterModels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const task = document.getElementById('taskFilter').value;
            const project = document.getElementById('projectFilter').value;
            const sort = document.getElementById('sortFilter').value;

            filteredModels = models.filter(model => {
                const matchSearch = !search ||
                    model.name.toLowerCase().includes(search) ||
                    (model.task && model.task.toLowerCase().includes(search));
                const matchTask = !task || model.task === task;
                const matchProject = !project || model.project_id === project;
                return matchSearch && matchTask && matchProject;
            });

            // 排序
            filteredModels.sort((a, b) => {
                switch (sort) {
                    case 'newest': return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest': return new Date(a.created_at) - new Date(b.created_at);
                    case 'size': return (b.size || 0) - (a.size || 0);
                    case 'name': return a.name.localeCompare(b.name);
                    default: return 0;
                }
            });

            renderModels();
        }

        // 渲染模型列表
        function renderModels() {
            const grid = document.getElementById('modelsGrid');
            const empty = document.getElementById('emptyState');

            if (filteredModels.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'flex';
                return;
            }

            grid.style.display = 'grid';
            empty.style.display = 'none';

            if (currentView === 'grid') {
                grid.innerHTML = filteredModels.map(model => createModelCard(model)).join('');
            } else {
                grid.innerHTML = `
                    <table class="models-table">
                        <thead>
                            <tr>
                                <th>模型名称</th>
                                <th>任务类型</th>
                                <th>参数量</th>
                                <th>大小</th>
                                <th>项目</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredModels.map(model => createModelRow(model)).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        // 创建模型卡片
        function createModelCard(model) {
            const taskBadge = getTaskBadge(model.task);
            const metrics = model.metrics || {};

            return `
                <div class="model-card" onclick="showModelDetail('${model.id}')">
                    <div class="card-header">
                        ${taskBadge}
                        <div class="card-actions">
                            <button class="btn btn-icon btn-sm" onclick="event.stopPropagation(); showModelDetail('${model.id}')" title="查看详情">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                            <button class="btn btn-icon btn-sm" onclick="event.stopPropagation(); deleteModel('${model.id}', '${model.name}')" title="删除">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="model-name" title="${model.name}">${model.name}</h3>
                        <div class="model-meta">
                            ${model.parameters ? `<span>${formatNumber(model.parameters)} 参数</span>` : ''}
                            <span>${formatBytes(model.size)}</span>
                        </div>
                        ${metrics.mAP50 ? `
                            <div class="model-metrics">
                                <div class="metric">
                                    <span class="metric-label">mAP50</span>
                                    <span class="metric-value">${(metrics.mAP50 * 100).toFixed(1)}%</span>
                                </div>
                                ${metrics.mAP50_95 ? `
                                    <div class="metric">
                                        <span class="metric-label">mAP50-95</span>
                                        <span class="metric-value">${(metrics.mAP50_95 * 100).toFixed(1)}%</span>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                        ${model.project_name ? `
                            <div class="model-project">
                                <span class="project-tag">${model.project_name}</span>
                            </div>
                        ` : ''}
                    </div>
                    <div class="card-footer">
                        <span class="date">${formatDate(model.created_at)}</span>
                        <a href="/model?id=${model.id}" class="btn btn-sm btn-primary" onclick="event.stopPropagation();">
                            详情
                        </a>
                    </div>
                </div>
            `;
        }

        // 创建任务标签
        function getTaskBadge(task) {
            const names = {
                'detect': '检测',
                'segment': '分割',
                'pose': '姿态',
                'classify': '分类',
                'obb': '旋转'
            };
            const name = names[task] || task || '未知';
            return `<span class="task-badge ${task}">${name}</span>`;
        }

        // 创建模型行（列表视图）
        function createModelRow(model) {
            const taskBadge = getTaskBadge(model.task);

            return `
                <tr onclick="showModelDetail('${model.id}')">
                    <td>
                        <div class="model-cell">
                            <span class="model-name">${model.name}</span>
                        </div>
                    </td>
                    <td>${taskBadge}</td>
                    <td>${model.parameters ? formatNumber(model.parameters) : '-'}</td>
                    <td>${formatBytes(model.size)}</td>
                    <td>${model.project_name || '-'}</td>
                    <td>${formatDate(model.created_at)}</td>
                    <td>
                        <div class="action-btns">
                            <a href="/model?id=${model.id}" class="btn btn-sm btn-primary" onclick="event.stopPropagation();">详情</a>
                            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteModel('${model.id}', '${model.name}')">删除</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        // 显示模型详情
        async function showModelDetail(modelId) {
            try {
                const response = await API.get(`/api/v1/models/${modelId}`);
                if (response.success) {
                    renderModelDetail(response.model);
                    document.getElementById('detailModal').classList.add('active');
                }
            } catch (error) {
                console.error('获取模型详情失败:', error);
                alert('获取模型详情失败');
            }
        }

        // 渲染模型详情
        function renderModelDetail(model) {
            const taskIcon = getTaskIcon(model.task);
            const taskName = getTaskName(model.task);
            const metrics = model.metrics || {};
            const formats = model.export_formats || [];

            // 构建完整的性能指标
            const perfMetrics = [
                { label: 'mAP50', value: metrics.mAP50, color: '#4ECDC4' },
                { label: 'mAP50-95', value: metrics.mAP50_95, color: '#45B7D1' },
                { label: 'Precision', value: metrics.precision, color: '#96CEB4' },
                { label: 'Recall', value: metrics.recall, color: '#FFEAA7' },
                { label: 'F1 Score', value: metrics.f1, color: '#FF6B6B' }
            ];

            document.getElementById('detailTitle').textContent = model.name;
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-grid">
                    <!-- 基本信息 -->
                    <div class="detail-section">
                        <h3>基本信息</h3>
                        <table class="detail-table">
                            <tr><td>任务类型</td><td><span class="task-badge ${model.task}">${taskIcon} ${taskName}</span></td></tr>
                            <tr><td>参数量</td><td>${model.parameters ? formatNumber(model.parameters) : '-'}</td></tr>
                            <tr><td>文件大小</td><td>${formatBytes(model.size)}</td></tr>
                            <tr><td>创建时间</td><td>${formatDateTime(model.created_at)}</td></tr>
                            <tr><td>所属项目</td><td>${model.project_name || '公共模型'}</td></tr>
                        </table>
                    </div>

                    <!-- 性能指标 -->
                    <div class="detail-section">
                        <h3>性能指标</h3>
                        <div class="metrics-grid">
                            ${perfMetrics.map(m => m.value ? `
                                <div class="metric-card" style="--accent-color: ${m.color}">
                                    <span class="metric-title">${m.label}</span>
                                    <span class="metric-value large">${(m.value * 100).toFixed(2)}%</span>
                                    <div class="metric-bar">
                                        <div class="metric-fill" style="width: ${m.value * 100}%; background: ${m.color}"></div>
                                    </div>
                                </div>
                            ` : `
                                <div class="metric-card">
                                    <span class="metric-title">${m.label}</span>
                                    <span class="metric-value large">-</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 性能对比图表 -->
                    <div class="detail-section">
                        <h3>性能对比</h3>
                        <div style="height: 200px;">
                            <canvas id="metricsChart"></canvas>
                        </div>
                    </div>

                    <!-- 类别性能 -->
                    <div class="detail-section">
                        <h3>类别性能 (mAP50)</h3>
                        <div id="classMetrics" class="class-metrics">
                            ${model.class_metrics ? Object.entries(model.class_metrics).map(([cls, metric]) => `
                                <div class="class-metric-item">
                                    <span class="class-name">${cls}</span>
                                    <div class="class-bar-container">
                                        <div class="class-bar" style="width: ${(metric * 100).toFixed(1)}%"></div>
                                    </div>
                                    <span class="class-value">${(metric * 100).toFixed(1)}%</span>
                                </div>
                            `).join('') : '<p style="color: var(--text-secondary);">暂无类别指标</p>'}
                        </div>
                    </div>

                    <!-- 导出格式 -->
                    <div class="detail-section">
                        <h3>支持导出格式</h3>
                        <div class="formats-list">
                            ${formats.map(f => `
                                <span class="format-badge" title="${f.description || ''}">${f.name}</span>
                            `).join('') || '暂无导出格式'}
                        </div>
                    </div>

                    <!-- 类别名称 -->
                    <div class="detail-section full-width">
                        <h3>类别名称</h3>
                        <div class="class-names">
                            ${model.class_names ? model.class_names.map((c, i) =>
                                `<span class="class-tag">${i}: ${c}</span>`
                            ).join('') : '未定义'}
                        </div>
                    </div>

                    <!-- 训练配置 -->
                    <div class="detail-section full-width">
                        <h3>训练配置</h3>
                        <table class="detail-table">
                            <tr><td>训练轮数</td><td>${model.training_config?.epochs || '-'}</td></tr>
                            <tr><td>批大小</td><td>${model.training_config?.batch_size || '-'}</td></tr>
                            <tr><td>输入尺寸</td><td>${model.training_config?.img_size || '-'}px</td></tr>
                            <tr><td>优化器</td><td>${model.training_config?.optimizer || '-'}</td></tr>
                            <tr><td>数据增强</td><td>${model.training_config?.augmentation ? '已启用' : '默认'}</td></tr>
                        </table>
                    </div>
                </div>
                <div class="detail-actions">
                    <button class="btn btn-secondary" onclick="compareWithBaseline('${model.id}')">对比基准</button>
                    <a href="/model?id=${model.id}" class="btn btn-primary">完整详情 →</a>
                </div>
            `;

            // 渲染性能对比图表
            setTimeout(() => renderMetricsChart(perfMetrics), 100);
        }

        // 渲染性能对比图表
        function renderMetricsChart(perfMetrics) {
            const ctx = document.getElementById('metricsChart');
            if (!ctx) return;

            const labels = perfMetrics.filter(m => m.value).map(m => m.label);
            const data = perfMetrics.filter(m => m.value).map(m => m.value * 100);
            const colors = perfMetrics.filter(m => m.value).map(m => m.color);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '性能指标 (%)',
                        data: data,
                        backgroundColor: colors.map(c => c + '80'),
                        borderColor: colors,
                        borderWidth: 2,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: '#2a2a4a' },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });
        }

        // 与基准模型对比
        async function compareWithBaseline(modelId) {
            showToast('模型对比功能开发中', 'info');
        }

        // 切换视图
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-toggle .btn-icon').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(view));
            });
            renderModels();
        }

        // 显示上传模态框
        function showUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
            clearUpload();
        }

        // 关闭上传模态框
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        // 关闭详情模态框
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // 初始化上传区域
        function initUploadArea() {
            const area = document.getElementById('uploadArea');
            const input = document.getElementById('modelFile');

            area.addEventListener('dragover', (e) => {
                e.preventDefault();
                area.classList.add('dragover');
            });

            area.addEventListener('dragleave', () => {
                area.classList.remove('dragover');
            });

            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.name.endsWith('.pt')) {
                    handleFileSelect(file);
                } else {
                    alert('请上传 .pt 格式的模型文件');
                }
            });

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFileSelect(file);
            });
        }

        // 处理文件选择
        function handleFileSelect(file) {
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('uploadPreview').style.display = 'flex';
            document.getElementById('previewName').textContent = file.name;
            document.getElementById('previewSize').textContent = formatBytes(file.size);
            document.getElementById('modelName').value = file.name.replace('.pt', '');
            document.getElementById('uploadBtn').disabled = false;

            // 存储文件
            window.selectedModelFile = file;
        }

        // 清空上传
        function clearUpload() {
            window.selectedModelFile = null;
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('uploadPreview').style.display = 'none';
            document.getElementById('modelFile').value = '';
            document.getElementById('modelName').value = '';
            document.getElementById('modelDescription').value = '';
            document.getElementById('uploadProject').value = '';
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadProgress').style.display = 'none';
            document.getElementById('uploadResult').style.display = 'none';
        }

        // 上传模型
        async function uploadModel() {
            const file = window.selectedModelFile;
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('name', document.getElementById('modelName').value || file.name.replace('.pt', ''));
            formData.append('project_id', document.getElementById('uploadProject').value);
            formData.append('description', document.getElementById('modelDescription').value);

            const progress = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const result = document.getElementById('uploadResult');
            const uploadBtn = document.getElementById('uploadBtn');

            progress.style.display = 'block';
            uploadBtn.disabled = true;

            try {
                const xhr = new XMLHttpRequest();

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + '%';
                        progressText.textContent = percent + '%';
                    }
                };

                xhr.onload = async function() {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            result.innerHTML = `<span>模型上传成功！</span>`;
                            result.className = 'upload-result success';
                            result.style.display = 'block';

                            setTimeout(() => {
                                closeUploadModal();
                                loadModels();
                            }, 1500);
                        } else {
                            throw new Error(response.message || '上传失败');
                        }
                    } else {
                        throw new Error('上传失败');
                    }
                };

                xhr.onerror = function() {
                    throw new Error('网络错误');
                };

                xhr.open('POST', '/api/v1/models/upload');
                xhr.send(formData);

            } catch (error) {
                result.innerHTML = `<span>上传失败: ${error.message}</span>`;
                result.className = 'upload-result error';
                result.style.display = 'block';
                uploadBtn.disabled = false;
            }
        }

        // 删除模型
        function deleteModel(id, name) {
            deleteModelId = id;
            document.getElementById('deleteModelName').textContent = name;
            document.getElementById('deleteModal').classList.add('active');
        }

        // 确认删除
        async function confirmDelete() {
            if (!deleteModelId) return;

            try {
                const response = await API.delete(`/api/v1/models/${deleteModelId}`);
                if (response.success) {
                    closeDeleteModal();
                    loadModels();
                } else {
                    alert('删除失败: ' + response.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }

        // 关闭删除确认框
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteModelId = null;
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('loadingState').style.display = 'flex';
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loadingState').style.display = 'none';
        }

        // 显示空状态
        function showEmpty() {
            document.getElementById('modelsGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'flex';
        }

        // 工具函数
        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('zh-CN');
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN');
        }

        // 点击模态框外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUploadModal();
                closeDetailModal();
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
