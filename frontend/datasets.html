<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集管理 - AI Vision Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="company-logo-section">
                <img src="/static/company-logo.png" alt="公司Logo">
                <a href="/" class="navbar-brand">AI Vision</a>
            </div>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">首页</a></li>
                <li><a href="/inference" class="nav-link">模型推理</a></li>
                <li><a href="/training" class="nav-link">模型训练</a></li>
                <li><a href="/models" class="nav-link">模型管理</a></li>
                <li><a href="/datasets" class="nav-link active">数据集</a></li>
                <li><a href="/annotation" class="nav-link">智能标注</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- 页面标题 -->
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
            <div>
                <h1 style="margin: 0; font-size: 1.5rem; color: var(--dark-color);">数据集管理</h1>
                <p style="margin: 0.25rem 0 0; color: var(--secondary-color); font-size: 0.9rem;">管理和查看您的训练数据集</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-primary" onclick="showUploadModal()">
                    <span>+</span> 上传数据集
                </button>
                <button class="btn btn-secondary" onclick="loadDatasets({ force: true })">
                    <span>↻</span> 刷新
                </button>
            </div>
        </div>

        <!-- 统计摘要 -->
        <div id="dataset-summary" class="grid grid-4" style="display: none; margin-bottom: 1.5rem;">
            <div class="stat-card">
                <div class="stat-value" id="summary-total-datasets">0</div>
                <div class="stat-label">数据集</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.2));">
                <div class="stat-value" id="summary-total-images">0</div>
                <div class="stat-label">图片总数</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.2));">
                <div class="stat-value" id="summary-total-annotations">0</div>
                <div class="stat-label">标注总数</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(217, 119, 6, 0.2));">
                <div class="stat-value" id="summary-total-classes">0</div>
                <div class="stat-label">类别</div>
            </div>
        </div>

        <!-- 数据集卡片列表 -->
        <div class="card">
            <div class="card-header">
                <span>我的数据集</span>
            </div>
            <div id="datasets-container">
                <div class="loading-placeholder">
                    <span class="loading"></span> 加载中...
                </div>
            </div>
        </div>
    </div>

    <!-- 上传数据集模态框 -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3>上传数据集</h3>
                <button class="modal-close" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">数据集名称 *</label>
                    <input type="text" id="datasetName" placeholder="输入数据集名称" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">任务类型</label>
                    <select id="taskType" class="form-control">
                        <option value="detect">检测</option>
                        <option value="segment">分割</option>
                        <option value="pose">姿态估计</option>
                        <option value="classify">分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">上传文件 (ZIP/图片)</label>
                    <div class="upload-area" id="upload-drop-area" onclick="document.getElementById('datasetFile').click()">
                        <input type="file" id="datasetFile" accept=".zip,.jpg,.jpeg,.png,.bmp" style="display: none;" onchange="handleFileSelect(event)">
                        <div id="upload-placeholder">
                            <p style="font-size: 2rem; margin-bottom: 0.5rem;">📦</p>
                            <p>点击或拖拽上传</p>
                            <p style="color: var(--secondary-color); font-size: 0.85rem;">支持 ZIP 或单张图片</p>
                        </div>
                        <div id="upload-file-info" style="display: none;">
                            <p style="font-size: 1.5rem; margin-bottom: 0.5rem;">📄</p>
                            <p id="upload-file-name" style="font-weight: 500; word-break: break-all;"></p>
                            <p id="upload-file-size" style="color: var(--secondary-color); font-size: 0.85rem;"></p>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="smartStorage" checked style="width: auto;">
                        <span style="color: var(--secondary-color); font-size: 0.9rem;">启用智能存储</span>
                    </label>
                </div>
                <div id="upload-progress-container" style="display: none; margin-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span id="upload-status-text">上传中...</span>
                        <span id="upload-percent">0%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" id="upload-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeUploadModal()">取消</button>
                <button class="btn btn-primary" id="upload-submit-btn" onclick="uploadDataset()">开始上传</button>
            </div>
        </div>
    </div>

    <!-- 数据集统计模态框 -->
    <div class="modal-overlay" id="statsModal">
        <div class="modal" style="max-width: 900px; max-height: 90vh;">
            <div class="modal-header">
                <h3 id="statsModalTitle">数据集统计</h3>
                <button class="modal-close" onclick="closeStatsModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 0;">
                <!-- 统计卡片 -->
                <div style="padding: 1.25rem; border-bottom: 1px solid var(--border-color);">
                    <div class="grid grid-4" style="gap: 1rem;">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-images">0</div>
                            <div class="stat-label">图片</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.2));">
                            <div class="stat-value" id="stat-annotations">0</div>
                            <div class="stat-label">标注</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.2));">
                            <div class="stat-value" id="stat-classes">0</div>
                            <div class="stat-label">类别</div>
                        </div>
                        <div class="stat-card" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(217, 119, 6, 0.2));">
                            <div class="stat-value" id="stat-size">0 MB</div>
                            <div class="stat-label">大小</div>
                        </div>
                    </div>
                </div>
                <!-- 标签页 -->
                <div class="panel-tabs" style="padding: 1rem 1.25rem; gap: 0.5rem;">
                    <button class="panel-tab active" onclick="switchStatsTab('class')">类别分布</button>
                    <button class="panel-tab" onclick="switchStatsTab('spatial')">位置热图</button>
                    <button class="panel-tab" onclick="switchStatsTab('dimension')">维度分析</button>
                    <button class="panel-tab" onclick="switchStatsTab('split')">拆分比例</button>
                </div>
                <!-- 图表区域 -->
                <div class="stats-chart-container" style="height: 350px; padding: 0 1.25rem 1.25rem;">
                    <div id="classChartTab" class="stats-chart active">
                        <canvas id="classChart"></canvas>
                    </div>
                    <div id="spatialChartTab" class="stats-chart">
                        <canvas id="spatialChart"></canvas>
                    </div>
                    <div id="dimensionChartTab" class="stats-chart">
                        <canvas id="dimensionChart"></canvas>
                    </div>
                    <div id="splitChartTab" class="stats-chart">
                        <canvas id="splitChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片浏览模态框 -->
    <div class="modal-overlay" id="browseImagesModal">
        <div class="modal" style="max-width: 95%; width: 1400px; max-height: 90vh;">
            <div class="modal-header" style="flex-shrink: 0;">
                <h3 id="browseModalTitle">浏览图片</h3>
                <button class="modal-close" onclick="closeBrowseImagesModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 0; display: flex; flex-direction: column; overflow: hidden;">
                <!-- 工具栏 -->
                <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                    <div style="display: flex; gap: 0.35rem;">
                        <button class="btn btn-sm" id="view-grid-btn" onclick="setViewMode('grid')">▦</button>
                        <button class="btn btn-sm" id="view-compact-btn" onclick="setViewMode('compact')">▤</button>
                        <button class="btn btn-sm" id="view-table-btn" onclick="setViewMode('table')">☰</button>
                    </div>
                    <div style="border-left: 1px solid var(--border-color); padding-left: 0.75rem; display: flex; gap: 0.5rem; align-items: center;">
                        <select id="split-filter" class="form-control" style="width: auto; padding: 0.4rem 0.6rem; font-size: 0.85rem;" onchange="filterImages()">
                            <option value="">全部</option>
                            <option value="train">训练</option>
                            <option value="val">验证</option>
                            <option value="test">测试</option>
                            <option value="unknown">未分配</option>
                        </select>
                    </div>
                    <div style="margin-left: auto; display: flex; gap: 0.75rem; align-items: center;">
                        <span id="image-count" style="color: var(--secondary-color); font-size: 0.85rem;">0 张</span>
                        <button class="btn btn-sm btn-secondary" onclick="exportToNDJSON()">导出</button>
                    </div>
                </div>
                <!-- 图片容器 -->
                <div id="images-container" style="flex: 1; overflow-y: auto; padding: 1rem; min-height: 300px;">
                </div>
                <!-- 分页 -->
                <div style="padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; gap: 1rem; flex-shrink: 0;">
                    <button class="btn btn-sm btn-secondary" id="prev-page" onclick="changePage(-1)">上一页</button>
                    <span id="page-info" style="color: var(--secondary-color); font-size: 0.9rem;">1 / 1</span>
                    <button class="btn btn-sm btn-secondary" id="next-page" onclick="changePage(1)">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏图片查看器 -->
    <div class="modal-overlay" id="imageViewerModal" style="background: rgba(0,0,0,0.95); z-index: 2000;">
        <div style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10;">
            <button class="btn btn-ghost" style="color: white;" onclick="toggleLabels()">标签</button>
            <button class="btn btn-ghost" style="color: white;" onclick="downloadImage()">下载</button>
            <button class="modal-close" style="color: white; font-size: 2rem;" onclick="closeImageViewer()">&times;</button>
        </div>
        <div style="position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; z-index: 10;">
            <button class="btn btn-ghost" style="color: white;" onclick="prevImage()">◀</button>
            <span id="viewer-counter" style="color: white; padding: 0.5rem 1rem; background: rgba(0,0,0,0.5); border-radius: 4px;">1 / 1</span>
            <button class="btn btn-ghost" style="color: white;" onclick="nextImage()">▶</button>
        </div>
        <div id="image-viewer-content" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        // 全局状态
        let currentDataset = null;
        let charts = {};
        let selectedFile = null;

        // 图片浏览状态
        let browseState = {
            datasetName: null,
            images: [],
            currentPage: 1,
            pageSize: 24,
            viewMode: 'grid',
            splitFilter: '',
            total: 0
        };

        let viewerState = {
            currentIndex: 0,
            showLabels: true
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadDatasets();
            setupDragDrop();
        });

        // 拖拽上传
        function setupDragDrop() {
            const dropArea = document.getElementById('upload-drop-area');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => dropArea.classList.add('drag-over'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => dropArea.classList.remove('drag-over'), false);
            });

            dropArea.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) handleFile(files[0]);
            }, false);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) handleFile(file);
        }

        function handleFile(file) {
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            const allowedTypes = ['.zip', '.jpg', '.jpeg', '.png', '.bmp'];
            if (!allowedTypes.includes(ext)) {
                showToast('不支持的文件格式', 'warning');
                return;
            }
            selectedFile = file;
            document.getElementById('upload-placeholder').style.display = 'none';
            document.getElementById('upload-file-info').style.display = 'block';
            document.getElementById('upload-file-name').textContent = file.name;
            document.getElementById('upload-file-size').textContent = formatBytes(file.size);
        }

        // 加载数据集列表
        async function loadDatasets({ force = false } = {}) {
            const container = document.getElementById('datasets-container');
            container.innerHTML = '<div class="loading-placeholder"><span class="loading"></span> 加载中...</div>';

            try {
                const response = await fetch('/api/v1/datasets/list');
                const data = await response.json();
                const datasets = data.datasets || [];

                if (datasets.length > 0) {
                    renderDatasets(datasets);
                } else {
                    renderEmptyState();
                }
            } catch (error) {
                console.error('加载数据集失败:', error);
                container.innerHTML = `<div class="loading-placeholder" style="color: var(--danger-color);">加载失败，请刷新重试</div>`;
            }
        }

        // 渲染数据集卡片
        function renderDatasets(datasets) {
            // 更新统计
            const totalDatasets = datasets.length;
            const totalImages = datasets.reduce((sum, item) => sum + (item.num_images || 0), 0);
            const totalAnnotations = datasets.reduce((sum, item) => sum + (item.num_annotations || 0), 0);
            const classSet = new Set();
            datasets.forEach(item => (item.classes || []).forEach(cls => classSet.add(cls)));

            document.getElementById('summary-total-datasets').textContent = totalDatasets;
            document.getElementById('summary-total-images').textContent = formatNumber(totalImages);
            document.getElementById('summary-total-annotations').textContent = formatNumber(totalAnnotations);
            document.getElementById('summary-total-classes').textContent = classSet.size;
            document.getElementById('dataset-summary').style.display = 'grid';

            // 渲染卡片
            const container = document.getElementById('datasets-container');
            container.innerHTML = `<div class="dataset-card-grid">
                ${datasets.map(ds => `
                    <div class="dataset-card">
                        <div class="dataset-card-header">
                            <div class="dataset-card-icon">📁</div>
                            <div class="dataset-card-info">
                                <h3>${ds.name}</h3>
                                <span class="chip">${getTaskTypeName(ds.task_type)}</span>
                            </div>
                        </div>
                        <div class="dataset-card-stats">
                            <div class="dataset-card-stat">
                                <span class="stat-num">${formatNumber(ds.num_images || 0)}</span>
                                <span class="stat-text">图片</span>
                            </div>
                            <div class="dataset-card-stat">
                                <span class="stat-num">${ds.num_classes || 0}</span>
                                <span class="stat-text">类别</span>
                            </div>
                            <div class="dataset-card-stat">
                                <span class="stat-num">${ds.split?.train || 0}/${ds.split?.val || 0}</span>
                                <span class="stat-text">训练/验证</span>
                            </div>
                        </div>
                        <div class="dataset-card-classes">
                            ${(ds.classes || []).slice(0, 4).map(c => `<span class="chip">${c}</span>`).join('')}
                            ${(ds.classes || []).length > 4 ? `<span class="chip">+${(ds.classes || []).length - 4}</span>` : ''}
                        </div>
                        <div class="dataset-card-actions">
                            <button class="btn btn-sm btn-secondary" onclick="viewStats('${ds.name}')">统计</button>
                            <button class="btn btn-sm btn-secondary" onclick="processDataset('${ds.name}')">处理</button>
                            <button class="btn btn-sm btn-primary" onclick="openBrowseImages('${ds.name}')">浏览</button>
                            <button class="btn btn-sm btn-ghost" onclick="deleteDataset('${ds.name}')">删除</button>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderEmptyState() {
            document.getElementById('dataset-summary').style.display = 'none';
            document.getElementById('datasets-container').innerHTML = `
                <div style="text-align: center; padding: 4rem 2rem; color: var(--secondary-color);">
                    <div style="font-size: 3.5rem; margin-bottom: 1rem;">📂</div>
                    <p style="font-size: 1.1rem; margin-bottom: 1.5rem;">暂无数据集</p>
                    <button class="btn btn-primary" onclick="showUploadModal()">+ 上传数据集</button>
                </div>
            `;
        }

        function getTaskTypeName(type) {
            const names = { 'detect': '检测', 'segment': '分割', 'pose': '姿态', 'classify': '分类', 'obb': 'OBB' };
            return names[type] || type;
        }

        // ==================== 图片浏览 ====================
        async function openBrowseImages(datasetName) {
            browseState.datasetName = datasetName;
            browseState.currentPage = 1;
            browseState.images = [];
            browseState.splitFilter = '';

            document.getElementById('browseModalTitle').textContent = `📁 ${datasetName}`;
            document.getElementById('split-filter').value = '';
            setViewMode('grid');

            document.getElementById('browseImagesModal').classList.add('active');
            await loadImages();
        }

        function closeBrowseImagesModal() {
            document.getElementById('browseImagesModal').classList.remove('active');
        }

        async function loadImages() {
            const container = document.getElementById('images-container');
            container.innerHTML = '<div class="loading-placeholder"><span class="loading"></span> 加载中...</div>';

            try {
                const params = new URLSearchParams({
                    page: browseState.currentPage,
                    page_size: browseState.pageSize,
                    view: browseState.viewMode
                });
                if (browseState.splitFilter) params.append('split', browseState.splitFilter);

                const response = await fetch(`/api/v1/datasets/${browseState.datasetName}/images?${params}`);
                const data = await response.json();

                if (data.success) {
                    browseState.images = data.images;
                    browseState.total = data.total;
                    renderImages();
                    updatePagination(data);
                } else {
                    container.innerHTML = '<div class="loading-placeholder" style="color: var(--danger-color);">加载失败</div>';
                }
            } catch (error) {
                console.error('加载图片失败:', error);
                container.innerHTML = `<div class="loading-placeholder" style="color: var(--danger-color);">加载失败: ${error.message}</div>`;
            }
        }

        function renderImages() {
            const container = document.getElementById('images-container');
            document.getElementById('image-count').textContent = `${browseState.total} 张`;

            if (browseState.images.length === 0) {
                container.innerHTML = '<div class="loading-placeholder">暂无图片</div>';
                return;
            }

            if (browseState.viewMode === 'table') {
                renderTableView(container);
            } else if (browseState.viewMode === 'compact') {
                renderCompactView(container);
            } else {
                renderGridView(container);
            }
        }

        function renderGridView(container) {
            container.innerHTML = `<div class="image-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem;">
                ${browseState.images.map((img, index) => `
                    <div class="image-grid-item" onclick="openImageViewer(${index})">
                        <img src="${img.thumbnail}" alt="${img.filename}" loading="lazy">
                        ${img.label_count > 0 ? `<span class="label-badge">${img.label_count}</span>` : ''}
                        <div class="image-info">
                            <span style="font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${img.filename}</span>
                            <span class="split-tag split-${img.split}">${getSplitName(img.split)}</span>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderCompactView(container) {
            container.innerHTML = `<div class="image-compact" style="grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.35rem;">
                ${browseState.images.map((img, index) => `
                    <div class="image-compact-item" onclick="openImageViewer(${index})">
                        <img src="${img.thumbnail}" alt="${img.filename}" loading="lazy">
                    </div>
                `).join('')}
            </div>`;
        }

        function renderTableView(container) {
            container.innerHTML = `
                <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                    <thead>
                        <tr style="background: rgba(99, 102, 241, 0.05);">
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">预览</th>
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">文件名</th>
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">尺寸</th>
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">拆分</th>
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">标注</th>
                            <th style="padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color);">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${browseState.images.map((img, index) => `
                            <tr>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color);">
                                    <img src="${img.thumbnail}" alt="${img.filename}" style="width: 50px; height: 35px; object-fit: cover; border-radius: 4px; cursor: pointer;" onclick="openImageViewer(${index})">
                                </td>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color);">${img.filename}</td>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color); color: var(--secondary-color);">${img.width}×${img.height}</td>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color);"><span class="split-tag split-${img.split}">${getSplitName(img.split)}</span></td>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color);">${img.label_count}</td>
                                <td style="padding: 0.5rem; border-bottom: 1px solid var(--border-color);">
                                    <button class="btn btn-sm btn-ghost" onclick="openImageViewer(${index})">查看</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function getSplitName(split) {
            const names = { 'train': '训练', 'val': '验证', 'test': '测试', 'unknown': '未分配' };
            return names[split] || split;
        }

        function setViewMode(mode) {
            browseState.viewMode = mode;
            ['grid', 'compact', 'table'].forEach(m => {
                const btn = document.getElementById(`view-${m}-btn`);
                if (btn) {
                    btn.className = `btn btn-sm ${m === mode ? 'btn-primary' : 'btn-secondary'}`;
                }
            });
            renderImages();
        }

        function filterImages() {
            browseState.splitFilter = document.getElementById('split-filter').value;
            browseState.currentPage = 1;
            loadImages();
        }

        function updatePagination(data) {
            const totalPages = Math.ceil(data.total / data.page_size);
            document.getElementById('page-info').textContent = `${data.page} / ${totalPages}`;
            document.getElementById('prev-page').disabled = data.page <= 1;
            document.getElementById('next-page').disabled = data.page >= totalPages;
        }

        function changePage(delta) {
            browseState.currentPage += delta;
            loadImages();
        }

        // ==================== 全屏图片查看器 ====================
        function openImageViewer(index) {
            viewerState.currentIndex = index;
            viewerState.showLabels = true;
            renderImageViewer();
            document.getElementById('imageViewerModal').classList.add('active');
            document.addEventListener('keydown', handleViewerKeydown);
        }

        function closeImageViewer() {
            document.getElementById('imageViewerModal').classList.remove('active');
            document.removeEventListener('keydown', handleViewerKeydown);
        }

        function renderImageViewer() {
            const img = browseState.images[viewerState.currentIndex];
            if (!img) return;

            const container = document.getElementById('image-viewer-content');
            document.getElementById('viewer-counter').textContent = `${viewerState.currentIndex + 1} / ${browseState.images.length}`;

            let html = `<img src="${img.path}" alt="${img.filename}" id="viewer-image" style="max-width: 100%; max-height: 100%; object-fit: contain;">`;
            if (viewerState.showLabels && img.labels?.length > 0) {
                html += `<div class="image-viewer-labels" id="viewer-labels"></div>`;
            }
            container.innerHTML = html;

            if (viewerState.showLabels && img.labels?.length > 0) {
                renderLabels(img);
            }
        }

        function renderLabels(img) {
            const labelsContainer = document.getElementById('viewer-labels');
            if (!labelsContainer) return;

            const imgElement = document.getElementById('viewer-image');
            const imgRect = imgElement.getBoundingClientRect();

            labelsContainer.innerHTML = img.labels.map(label => {
                const bbox = label.bbox;
                if (bbox && bbox.length >= 4) {
                    const x = bbox[0] * imgRect.width - (bbox[2] * imgRect.width / 2);
                    const y = bbox[1] * imgRect.height - (bbox[3] * imgRect.height / 2);
                    const w = bbox[2] * imgRect.width;
                    const h = bbox[3] * imgRect.height;
                    return `<div class="label-box" style="left: ${x}px; top: ${y}px; width: ${w}px; height: ${h}px; position: absolute; border: 2px solid #00ff00; background: rgba(0, 255, 0, 0.1);"><div style="position: absolute; top: -20px; left: 0; background: #00ff00; color: black; padding: 0.1rem 0.3rem; font-size: 0.75rem; font-weight: 600;">${label.class_id}</div></div>`;
                }
                return '';
            }).join('');
        }

        function toggleLabels() {
            viewerState.showLabels = !viewerState.showLabels;
            renderImageViewer();
        }

        function prevImage() {
            if (viewerState.currentIndex > 0) {
                viewerState.currentIndex--;
                renderImageViewer();
            }
        }

        function nextImage() {
            if (viewerState.currentIndex < browseState.images.length - 1) {
                viewerState.currentIndex++;
                renderImageViewer();
            }
        }

        function handleViewerKeydown(e) {
            switch (e.key) {
                case 'ArrowLeft': prevImage(); break;
                case 'ArrowRight': nextImage(); break;
                case 'Escape': closeImageViewer(); break;
                case 'l': toggleLabels(); break;
            }
        }

        function downloadImage() {
            const img = browseState.images[viewerState.currentIndex];
            if (img) {
                const a = document.createElement('a');
                a.href = img.path;
                a.download = img.filename;
                a.click();
            }
        }

        // ==================== 上传功能 ====================
        function showUploadModal() {
            resetUploadModal();
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            resetUploadModal();
        }

        function resetUploadModal() {
            selectedFile = null;
            document.getElementById('datasetName').value = '';
            document.getElementById('taskType').value = 'detect';
            document.getElementById('datasetFile').value = '';
            document.getElementById('smartStorage').checked = true;
            document.getElementById('upload-placeholder').style.display = 'block';
            document.getElementById('upload-file-info').style.display = 'none';
            document.getElementById('upload-progress-container').style.display = 'none';
            document.getElementById('upload-progress-bar').style.width = '0%';
            document.getElementById('upload-percent').textContent = '0%';
            document.getElementById('upload-submit-btn').disabled = false;
            document.getElementById('upload-submit-btn').textContent = '开始上传';
        }

        async function uploadDataset() {
            const name = document.getElementById('datasetName').value.trim();
            const taskType = document.getElementById('taskType').value;
            const smartStorage = document.getElementById('smartStorage').checked;

            if (!name) { showToast('请输入数据集名称', 'warning'); return; }
            if (!selectedFile) { showToast('请选择上传文件', 'warning'); return; }

            document.getElementById('upload-submit-btn').disabled = true;
            document.getElementById('upload-submit-btn').innerHTML = '<span class="loading"></span> 上传中...';
            document.getElementById('upload-progress-container').style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('name', name);
            formData.append('task_type', taskType);
            formData.append('use_smart_storage', smartStorage);

            try {
                const xhr = new XMLHttpRequest();
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('upload-progress-bar').style.width = percent + '%';
                        document.getElementById('upload-percent').textContent = percent + '%';
                    }
                });

                xhr.addEventListener('load', async () => {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            document.getElementById('upload-status-text').textContent = '上传完成';
                            document.getElementById('upload-progress-bar').style.width = '100%';
                            await new Promise(r => setTimeout(r, 500));
                            closeUploadModal();
                            showToast('上传成功', 'success');
                            loadDatasets();
                        } else {
                            showToast(data.message || '上传失败', 'error');
                            resetUploadModal();
                        }
                    } else {
                        throw new Error('上传失败');
                    }
                });

                xhr.addEventListener('error', () => {
                    showToast('上传失败，请检查网络', 'error');
                    resetUploadModal();
                });

                xhr.open('POST', '/api/v1/datasets/upload');
                xhr.send(formData);
            } catch (error) {
                showToast('上传失败: ' + error.message, 'error');
                resetUploadModal();
            }
        }

        // ==================== 统计功能 ====================
        async function viewStats(datasetName) {
            currentDataset = datasetName;
            document.getElementById('statsModalTitle').textContent = `📊 ${datasetName}`;
            document.getElementById('statsModal').classList.add('active');

            try {
                const response = await fetch(`/api/v1/datasets/${datasetName}/statistics`);
                const data = await response.json();
                if (data.success) updateStatsDisplay(data);
            } catch (error) {
                console.error('获取统计失败:', error);
                showToast('获取统计信息失败', 'error');
            }
        }

        function closeStatsModal() {
            document.getElementById('statsModal').classList.remove('active');
            currentDataset = null;
        }

        function updateStatsDisplay(data) {
            const summary = data.summary || {};
            document.getElementById('stat-images').textContent = formatNumber(summary.total_images || 0);
            document.getElementById('stat-annotations').textContent = formatNumber(summary.total_annotations || 0);
            document.getElementById('stat-classes').textContent = summary.total_classes || 0;
            document.getElementById('stat-size').textContent = (summary.total_size_mb || 0) + ' MB';

            renderClassChart(data.class_distribution);
            renderSpatialChart(data.spatial_distribution);
            renderDimensionChart(data.dimension_analysis);
            renderSplitChart(data.split_details);
        }

        function switchStatsTab(tab) {
            document.querySelectorAll('.panel-tabs .panel-tab').forEach(el => {
                el.classList.toggle('active', el.textContent.includes(tab === 'class' ? '类别' : tab === 'spatial' ? '位置' : tab === 'dimension' ? '维度' : '拆分'));
            });
            document.querySelectorAll('.stats-chart').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'ChartTab').classList.add('active');
        }

        function renderClassChart(data) {
            const ctx = document.getElementById('classChart').getContext('2d');
            if (charts.class) charts.class.destroy();
            if (!data?.chart_data) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }
            charts.class = new Chart(ctx, {
                type: 'bar',
                data: data.chart_data,
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: `类别分布 (${data.total_annotations || 0})` } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderSpatialChart(data) {
            const ctx = document.getElementById('spatialChart').getContext('2d');
            if (charts.spatial) charts.spatial.destroy();
            if (!data?.heatmap_data?.length) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }
            const heatmapData = { labels: Array.from({length: 10}, (_, i) => `${(i+1)*10}%`), datasets: [{ label: '密度', data: data.heatmap_data, backgroundColor: 'rgba(99, 102, 241, 0.7)' }] };
            charts.spatial = new Chart(ctx, { type: 'bar', data: heatmapData, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: `位置热图 (${data.total_points || 0})` } }, scales: { x: { title: { display: true, text: '水平' } }, y: { title: { display: true, text: '垂直' } } } } });
        }

        function renderDimensionChart(data) {
            const ctx = document.getElementById('dimensionChart').getContext('2d');
            if (charts.dimension) charts.dimension.destroy();
            if (!data?.scatter_data?.length) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }
            charts.dimension = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: [{ label: '尺寸', data: data.scatter_data.map(p => ({x: p[0], y: p[1]})), backgroundColor: 'rgba(99, 102, 241, 0.5)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: `维度分布 (${data.total_images || 0})` } }, scales: { x: { title: { display: true, text: '宽度' }, min: 0 }, y: { title: { display: true, text: '高度' }, min: 0 } } }
            });
        }

        function renderSplitChart(data) {
            const ctx = document.getElementById('splitChart').getContext('2d');
            if (charts.split) charts.split.destroy();
            if (!data?.chart_data) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }
            charts.split = new Chart(ctx, { type: 'doughnut', data: data.chart_data, options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: `拆分 (${data.total_images || 0})` }, legend: { position: 'bottom' } } } });
        }

        // ==================== 数据处理 ====================
        async function processDataset(name) {
            if (!confirm(`确定要处理数据集 "${name}" 吗？`)) return;
            showToast('开始处理...', 'info');
            try {
                const response = await fetch(`/api/v1/datasets/${name}/process`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showToast('处理完成', 'success');
                    loadDatasets();
                } else {
                    showToast(data.message || '处理失败', 'error');
                }
            } catch (error) {
                showToast('处理失败: ' + error.message, 'error');
            }
        }

        // ==================== 删除数据集 ====================
        async function deleteDataset(name) {
            if (!confirm(`确定要删除数据集 "${name}" 吗？此操作不可恢复。`)) return;
            try {
                const response = await fetch(`/api/v1/datasets/${name}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    showToast('已删除', 'success');
                    loadDatasets();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        // ==================== 导出 ====================
        function exportToNDJSON() {
            if (!browseState.datasetName) return;
            window.open(`/api/v1/datasets/${browseState.datasetName}/export/ndjson`, '_blank');
            showToast('正在导出...', 'info');
        }

        // ==================== 工具函数 ====================
        function formatNumber(num) {
            if (num >= 10000) return (num / 10000).toFixed(1) + '万';
            return num.toString();
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
