<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练 - OpenCV Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="/static/company-logo.png" alt="鑫恒福科技" style="height: 40px; object-fit: contain;">
                <a href="/" class="navbar-brand">OpenCV Platform</a>
            </div>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">首页</a></li>
                <li><a href="/inference" class="nav-link">模型推理</a></li>
                <li><a href="/training" class="nav-link active">模型训练</a></li>
                <li><a href="/models" class="nav-link">模型管理</a></li>
                <li><a href="/datasets" class="nav-link">数据集</a></li>
                <li><a href="/annotation" class="nav-link">数据标注</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">🚀 模型训练</div>
            
            <form id="training-form">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">项目名称</label>
                        <input type="text" id="project-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">数据集路径</label>
                        <input type="text" id="dataset-path" class="form-control" placeholder="data/datasets/my_dataset/data.yaml" required list="dataset-options">
                        <datalist id="dataset-options"></datalist>
                    </div>
                    <div class="form-group">
                        <label class="form-label">模型类型</label>
                        <select id="model-type" class="form-control">
                            <option value="yolo11n" selected>YOLO11n ⭐</option>
                            <option value="yolo11s">YOLO11s</option>
                            <option value="yolo11m">YOLO11m</option>
                            <option value="yolo11l">YOLO11l</option>
                            <option value="yolo11x">YOLO11x</option>
                            <option disabled>─────────────</option>
                            <option value="yolov8n">YOLOv8n</option>
                            <option value="yolov8s">YOLOv8s</option>
                            <option value="yolov8m">YOLOv8m</option>
                            <option value="yolov8l">YOLOv8l</option>
                            <option value="yolov8x">YOLOv8x</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label class="form-label">选择已下载模型（可选）</label>
                        <select id="base-model-select" class="form-control">
                            <option value="">使用上方模型类型对应的官方预训练权重</option>
                        </select>
                        <small style="color: var(--secondary-color); display: block; margin-top: 0.25rem;">
                            选择模型管理中已下载的模型继续训练，未选择时将使用官方预训练权重。
                        </small>
                    </div>
                    <div class="form-group">
                        <label class="form-label">训练轮数</label>
                        <input type="number" id="epochs" class="form-control" value="100" min="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">批次大小</label>
                        <input type="number" id="batch-size" class="form-control" value="16" min="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">图像尺寸</label>
                        <input type="number" id="img-size" class="form-control" value="640" min="320" step="32">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">开始训练</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">📋 训练任务</div>
            <div id="tasks-list">
                <p style="color: var(--secondary-color);">暂无训练任务</p>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        const baseModelSelect = document.getElementById('base-model-select');
        let localModelMap = new Map();

        async function loadModelOptions() {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '使用上方模型类型对应的官方预训练权重';

            baseModelSelect.innerHTML = '';
            baseModelSelect.appendChild(placeholder);

            try {
                const models = await API.listModels();
                localModelMap = new Map(models.map(model => [model.name, model.path]));

                if (models.length > 0) {
                    const localGroup = document.createElement('optgroup');
                    localGroup.label = '已下载模型';
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.path;
                        option.textContent = `${model.name} (${formatBytes(model.size || 0)})`;
                        option.dataset.name = model.name;
                        localGroup.appendChild(option);
                    });
                    baseModelSelect.appendChild(localGroup);
                }
            } catch (error) {
                console.warn('加载模型列表失败:', error);
            }
        }

        async function loadDatasetOptions() {
            try {
                const { datasets } = await API.listDatasets();
                const datalist = document.getElementById('dataset-options');
                datalist.innerHTML = datasets.map(ds => `<option value="${ds.path}">${ds.name} · ${ds.num_images || 0} 张图片</option>`).join('');
            } catch (error) {
                console.warn('加载数据集列表失败:', error);
            }
        }

        loadModelOptions();
        loadDatasetOptions();

        function renderMetrics(metrics) {
            if (!metrics || typeof metrics !== 'object') {
                return '';
            }
            const source = metrics.latest || metrics.final_metrics || metrics;
            if (!source || typeof source !== 'object') {
                return '';
            }
            const items = Object.entries(source)
                .filter(([, value]) => typeof value === 'number' && Number.isFinite(value))
                .slice(0, 3)
                .map(([key, value]) => `${key}: ${value.toFixed(4)}`);
            return items.join(', ');
        }

        document.getElementById('training-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const config = {
                project_name: document.getElementById('project-name').value,
                dataset_path: document.getElementById('dataset-path').value,
                model_type: document.getElementById('model-type').value,
                epochs: parseInt(document.getElementById('epochs').value),
                batch_size: parseInt(document.getElementById('batch-size').value),
                img_size: parseInt(document.getElementById('img-size').value),
                device: 'cpu'
            };

            const selectedBaseModel = baseModelSelect.value.trim();
            if (selectedBaseModel) {
                config.model_path = selectedBaseModel;
            } else {
                const fallbackName = `${config.model_type}.pt`;
                const localPath = localModelMap.get(fallbackName) || API.getLocalModelPath(fallbackName);
                if (localPath) {
                    config.model_path = localPath;
                }
            }

            try {
                const result = await API.startTraining(config);
                if (result.success) {
                    showAlert('训练任务已启动: ' + result.task_id, 'success');
                    loadTasks();
                } else {
                    showAlert('启动失败', 'danger');
                }
            } catch (error) {
                showAlert('错误: ' + error.message, 'danger');
            }
        });

        async function loadTasks() {
            try {
                const data = await API.listTrainingTasks();
                const tasksList = document.getElementById('tasks-list');
                
                if (data.tasks && data.tasks.length > 0) {
                    tasksList.innerHTML = data.tasks.map(task => {
                        const progress = Number(task.progress || 0);
                        const badgeClass = task.status === 'completed'
                            ? 'success'
                            : task.status === 'failed'
                                ? 'danger'
                                : task.status === 'running'
                                    ? 'primary'
                                    : 'warning';
                        const metricsText = renderMetrics(task.metrics);
                        const updatedAt = task.updated_at ? formatDate(task.updated_at) : '-';
                        return `
                            <div class="card" style="margin-bottom: 1rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                                    <h4 style="margin: 0;">${task.task_id}</h4>
                                    <span class="badge badge-${badgeClass}">${task.status}</span>
                                </div>
                                <div class="progress" style="margin-top: 0.5rem;">
                                    <div class="progress-bar" style="width: ${progress}%">${Math.round(progress)}%</div>
                                </div>
                                <div style="margin-top: 0.5rem; color: var(--secondary-color); font-size: 0.9rem;">
                                    <div>Epoch: ${task.current_epoch}/${task.total_epochs}</div>
                                    ${metricsText ? `<div>指标: ${metricsText}</div>` : ''}
                                    <div>更新时间: ${updatedAt}</div>
                                    ${task.error_message ? `<div style="color: #ef4444;">错误: ${task.error_message}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    tasksList.innerHTML = '<p style="color: var(--secondary-color);">暂无训练任务</p>';
                }
            } catch (error) {
                console.error('Failed to load tasks:', error);
            }
        }

        loadTasks();
        setInterval(loadTasks, 5000);
    </script>
</body>
</html>
