<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型推理 - OpenCV Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --primary-color: #2196F3;
            --success-color: #4CAF50;
            --warning-color: #FF9800;
            --danger-color: #f44336;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }

        .navbar-brand {
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .navbar-nav {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-color);
        }

        .container {
            padding: 1.5rem 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 页面标题 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title h1 {
            margin: 0 0 0.25rem 0;
            font-size: 1.5rem;
        }

        .page-title p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 主布局 */
        .inference-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .inference-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 左侧面板 */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .card-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 表单控件 */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        select.form-control {
            cursor: pointer;
        }

        /* 滑块 */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .slider-container input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #2a2a4a;
            border-radius: 3px;
            outline: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            min-width: 50px;
            text-align: right;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        /* 输入源选择 */
        .input-sources {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .source-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.75rem;
            background: #2a2a4a;
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .source-btn:hover {
            background: #3a3a5a;
            color: var(--text-primary);
        }

        .source-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(33, 150, 243, 0.1);
        }

        .source-btn svg {
            width: 24px;
            height: 24px;
            margin-bottom: 0.25rem;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #3a3a5a;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a2a4a20;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background: rgba(33, 150, 243, 0.05);
        }

        .upload-area svg {
            width: 48px;
            height: 48px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .upload-area p {
            margin: 0.5rem 0 0 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .upload-area .upload-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* URL 输入 */
        .url-input-group {
            display: none;
            gap: 0.5rem;
        }

        .url-input-group.active {
            display: flex;
        }

        .url-input-group input {
            flex: 1;
        }

        /* 批量文件列表 */
        .batch-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .batch-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: #2a2a4a;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .batch-item img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 4px;
        }

        .batch-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .batch-item .remove {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            padding: 0.25rem;
        }

        /* 按钮 */
        .btn {
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #1976D2;
        }

        .btn-primary:disabled {
            background: #3a3a5a;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #2a2a4a;
            color: var(--text-primary);
            border: 1px solid #3a3a5a;
        }

        .btn-secondary:hover {
            background: #3a3a5a;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        /* 推理按钮 */
        .infer-btn {
            margin-top: 1rem;
        }

        .infer-progress {
            display: none;
            margin-top: 0.5rem;
        }

        .infer-progress.active {
            display: block;
        }

        .progress-bar {
            height: 6px;
            background: #2a2a4a;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 右侧面板 */
        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 图片预览区 */
        .preview-area {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .preview-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .preview-tab {
            padding: 0.4rem 0.75rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .preview-tab.active {
            background: var(--primary-color);
            color: white;
        }

        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a4a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .preview-container img, .preview-container canvas {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .empty-preview {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }

        .empty-preview svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
            margin-bottom: 0.5rem;
        }

        /* 结果统计 */
        .results-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-item {
            background: #2a2a4a;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 检测列表 */
        .detections-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .detections-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .detections-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #2a2a4a;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            border-left: 3px solid;
        }

        .detection-info {
            flex: 1;
        }

        .detection-name {
            font-weight: 500;
        }

        .detection-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .detection-conf {
            background: rgba(33, 150, 243, 0.2);
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 类别颜色标记 */
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 复选框 */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }

        /* 设备选择 */
        .device-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .device-option {
            padding: 0.5rem;
            text-align: center;
            background: #2a2a4a;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .device-option:hover {
            background: #3a3a5a;
        }

        .device-option.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .device-option .icon {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        /* 开关 */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #2a2a4a;
        }

        .switch-label {
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #3a3a5a;
            border-radius: 24px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked + .slider {
            background: var(--primary-color);
        }

        .switch input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="/static/company-logo.png" alt="Logo" style="height: 40px;">
            <span class="navbar-brand">OpenCV Platform</span>
        </div>
        <ul class="navbar-nav">
            <li><a href="/" class="nav-link">首页</a></li>
            <li><a href="/inference" class="nav-link active">模型推理</a></li>
            <li><a href="/training" class="nav-link">模型训练</a></li>
            <li><a href="/models" class="nav-link">模型库</a></li>
            <li><a href="/datasets" class="nav-link">数据集</a></li>
            <li><a href="/annotation" class="nav-link">数据标注</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="page-title">
                <h1>模型推理</h1>
                <p>支持多种输入源，实时检测目标</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="exportResults()">📥 导出结果</button>
            </div>
        </div>

        <div class="inference-layout">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <!-- 模型选择 -->
                <div class="card">
                    <div class="card-header">🤖 模型选择</div>
                    <div class="form-group">
                        <label class="form-label">选择模型</label>
                        <select id="modelSelect" class="form-control">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">设备</label>
                        <div class="device-select" id="deviceSelect">
                            <div class="device-option active" data-device="auto">
                                <span class="icon">⚡</span>
                                自动
                            </div>
                            <div class="device-option" data-device="cuda">
                                <span class="icon">🎮</span>
                                GPU
                            </div>
                            <div class="device-option" data-device="cpu">
                                <span class="icon">💻</span>
                                CPU
                            </div>
                        </div>
                    </div>
                    <div class="switch-container">
                        <span class="switch-label">半精度推理 (FP16)</span>
                        <label class="switch">
                            <input type="checkbox" id="halfPrecision">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- 推理参数 -->
                <div class="card">
                    <div class="card-header">⚙️ 推理参数</div>
                    <div class="form-group">
                        <label class="form-label">置信度阈值: <span id="confValue">0.25</span></label>
                        <div class="slider-container">
                            <input type="range" id="confThreshold" min="0.01" max="0.99" step="0.01" value="0.25">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">IOU 阈值: <span id="iouValue">0.45</span></label>
                        <div class="slider-container">
                            <input type="range" id="iouThreshold" min="0.1" max="0.9" step="0.05" value="0.45">
                        </div>
                    </div>
                </div>

                <!-- 输入源 -->
                <div class="card">
                    <div class="card-header">📁 输入源</div>
                    <div class="input-sources">
                        <button class="source-btn active" data-source="file" onclick="setInputSource('file')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                            </svg>
                            文件
                        </button>
                        <button class="source-btn" data-source="url" onclick="setInputSource('url')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
                            </svg>
                            URL
                        </button>
                        <button class="source-btn" data-source="camera" onclick="setInputSource('camera')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                            </svg>
                            摄像头
                        </button>
                        <button class="source-btn" data-source="batch" onclick="setInputSource('batch')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                            </svg>
                            批量
                        </button>
                    </div>

                    <!-- 文件上传 -->
                    <div id="fileUpload" class="upload-area">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        <p>点击或拖拽上传图片</p>
                        <p class="upload-hint">支持 JPG, PNG, BMP 格式</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>

                    <!-- URL 输入 -->
                    <div id="urlInput" class="url-input-group">
                        <input type="text" class="form-control" id="urlText" placeholder="输入图片 URL...">
                        <button class="btn btn-primary" onclick="loadFromUrl()">加载</button>
                    </div>

                    <!-- 摄像头 -->
                    <div id="cameraInput" style="display: none;">
                        <div class="upload-area" id="cameraPreview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                            </svg>
                            <p>点击开始摄像头</p>
                        </div>
                    </div>

                    <!-- 批量上传 -->
                    <div id="batchInput" style="display: none;">
                        <div class="upload-area" id="batchUpload">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                            </svg>
                            <p>点击或拖拽上传多张图片</p>
                            <input type="file" id="batchInputFiles" accept="image/*" multiple hidden>
                        </div>
                        <div class="batch-list" id="batchList"></div>
                    </div>
                </div>

                <!-- 推理按钮 -->
                <button class="btn btn-primary btn-block infer-btn" id="inferBtn" disabled>
                    🚀 开始推理
                </button>
                <div class="infer-progress" id="inferProgress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">推理中...</div>
                </div>
            </div>

            <!-- 右侧结果面板 -->
            <div class="result-panel">
                <!-- 图片预览 -->
                <div class="preview-area">
                    <div class="preview-header">
                        <span class="card-header" style="margin: 0;">🖼️ 预览结果</span>
                        <div class="preview-tabs">
                            <button class="preview-tab active" onclick="switchPreviewTab('result')">检测结果</button>
                            <button class="preview-tab" onclick="switchPreviewTab('original')">原始图片</button>
                        </div>
                    </div>
                    <div class="preview-container" id="previewContainer">
                        <div class="empty-preview">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                            </svg>
                            <p>上传图片开始推理</p>
                        </div>
                    </div>
                    <div class="results-stats" id="resultsStats" style="display: none;">
                        <div class="stat-item">
                            <div class="stat-value" id="statTime">-</div>
                            <div class="stat-label">推理时间 (ms)</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statCount">-</div>
                            <div class="stat-label">检测数量</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statClasses">-</div>
                            <div class="stat-label">类别数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statImageSize">-</div>
                            <div class="stat-label">图片尺寸</div>
                        </div>
                    </div>
                </div>

                <!-- 检测列表 -->
                <div class="detections-section">
                    <div class="detections-header">
                        <span class="card-header" style="margin: 0;">📋 检测结果</span>
                        <button class="btn btn-secondary btn-sm" onclick="clearResults()">清除</button>
                    </div>
                    <div class="detections-list" id="detectionsList">
                        <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">
                            暂无检测结果
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        // 全局状态
        let currentSource = 'file';
        let currentFile = null;
        let batchFiles = [];
        let currentPreview = 'result';
        let currentResult = null;
        let cameraStream = null;

        // 颜色配置
        const COLORS = [
            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
            '#06b6d4', '#ec4899', '#14b8a6', '#f97316', '#6366f1',
            '#84cc16', '#f43f5e', '#0ea5e9', '#22c55e', '#eab308'
        ];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadModels();
            initEventListeners();
        });

        // 加载模型列表
        async function loadModels() {
            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option value="">加载中...</option>';

            try {
                const response = await API.get('/api/v1/models');
                if (response.success && response.models?.length > 0) {
                    let options = '<option value="">选择模型...</option>';
                    response.models.forEach(model => {
                        options += `<option value="${model.path}">${model.name} (${formatBytes(model.size)})</option>`;
                    });
                    select.innerHTML = options;
                } else {
                    // 使用内置模型
                    select.innerHTML = `
                        <option value="yolo11n.pt">YOLO11n (nano)</option>
                        <option value="yolov8n.pt">YOLOv8n (nano)</option>
                        <option value="yolov8s.pt">YOLOv8s (small)</option>
                        <option value="yolov8m.pt">YOLOv8m (medium)</option>
                    `;
                }
            } catch (error) {
                select.innerHTML = `
                    <option value="yolo11n.pt">YOLO11n (nano)</option>
                    <option value="yolov8n.pt">YOLOv8n (nano)</option>
                `;
            }
        }

        // 初始化事件监听
        function initEventListeners() {
            // 置信度滑块
            document.getElementById('confThreshold').addEventListener('input', (e) => {
                document.getElementById('confValue').textContent = e.target.value;
            });

            // IOU 滑块
            document.getElementById('iouThreshold').addEventListener('input', (e) => {
                document.getElementById('iouValue').textContent = e.target.value;
            });

            // 设备选择
            document.querySelectorAll('.device-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.device-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                });
            });

            // 文件上传
            const fileUpload = document.getElementById('fileUpload');
            const fileInput = document.getElementById('fileInput');

            fileUpload.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

            fileUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileUpload.classList.add('dragover');
            });
            fileUpload.addEventListener('dragleave', () => {
                fileUpload.classList.remove('dragover');
            });
            fileUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                fileUpload.classList.remove('drag-over');
                handleFileSelect(e.dataTransfer.files[0]);
            });

            // 批量上传
            const batchUpload = document.getElementById('batchUpload');
            const batchInput = document.getElementById('batchInputFiles');

            batchUpload.addEventListener('click', () => batchInput.click());
            batchInput.addEventListener('change', (e) => {
                handleBatchSelect(Array.from(e.target.files));
            });

            batchUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                batchUpload.classList.add('dragover');
            });
            batchUpload.addEventListener('dragleave', () => {
                batchUpload.classList.remove('dragover');
            });
            batchUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                batchUpload.classList.remove('dragover');
                handleBatchSelect(Array.from(e.dataTransfer.files));
            });

            // 推理按钮
            document.getElementById('inferBtn').addEventListener('click', startInference);
        }

        // 设置输入源
        function setInputSource(source) {
            currentSource = source;
            document.querySelectorAll('.source-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.source === source);
            });

            document.getElementById('fileUpload').style.display = source === 'file' ? 'block' : 'none';
            document.getElementById('urlInput').classList.toggle('active', source === 'url');
            document.getElementById('cameraInput').style.display = source === 'camera' ? 'block' : 'none';
            document.getElementById('batchInput').style.display = source === 'batch' ? 'block' : 'none';

            if (source !== 'camera') {
                stopCamera();
            }
        }

        // 处理文件选择
        function handleFileSelect(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('请选择图片文件', 'error');
                return;
            }
            currentFile = file;
            batchFiles = [file];
            document.getElementById('inferBtn').disabled = false;
            previewImage(file);
        }

        // 处理批量文件选择
        function handleBatchSelect(files) {
            const imageFiles = files.filter(f => f.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                showToast('请选择图片文件', 'error');
                return;
            }
            batchFiles = imageFiles;
            currentFile = imageFiles[0];
            document.getElementById('inferBtn').disabled = false;

            renderBatchList();
            previewImage(currentFile);
        }

        // 渲染批量文件列表
        function renderBatchList() {
            const list = document.getElementById('batchList');
            list.innerHTML = batchFiles.map((file, idx) => `
                <div class="batch-item ${idx === 0 ? 'active' : ''}" onclick="selectBatchFile(${idx})">
                    <img src="${URL.createObjectURL(file)}">
                    <span class="name">${file.name}</span>
                    <button class="remove" onclick="event.stopPropagation(); removeBatchFile(${idx})">×</button>
                </div>
            `).join('');
        }

        // 选择批量文件
        function selectBatchFile(idx) {
            currentFile = batchFiles[idx];
            previewImage(currentFile);
            document.querySelectorAll('.batch-item').forEach((item, i) => {
                item.classList.toggle('active', i === idx);
            });
        }

        // 移除批量文件
        function removeBatchFile(idx) {
            batchFiles.splice(idx, 1);
            if (batchFiles.length > 0) {
                currentFile = batchFiles[0];
                renderBatchList();
                previewImage(currentFile);
            } else {
                document.getElementById('batchList').innerHTML = '';
                document.getElementById('inferBtn').disabled = true;
            }
        }

        // 从 URL 加载
        async function loadFromUrl() {
            const url = document.getElementById('urlText').value.trim();
            if (!url) {
                showToast('请输入 URL', 'error');
                return;
            }

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const file = new File([blob], 'image.jpg', { type: blob.type });
                handleFileSelect(file);
                showToast('图片加载成功', 'success');
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        // 预览图片
        function previewImage(file) {
            const container = document.getElementById('previewContainer');
            const url = URL.createObjectURL(file);
            container.innerHTML = `<img src="${url}" id="previewImg">`;
        }

        // 切换预览标签
        function switchPreviewTab(tab) {
            currentPreview = tab;
            document.querySelectorAll('.preview-tab').forEach(t => {
                t.classList.toggle('active', t.textContent.includes(tab === 'result' ? '检测' : '原始'));
            });

            if (currentResult) {
                if (tab === 'result' && currentResult.canvasData) {
                    drawResult();
                } else {
                    previewImage(currentFile);
                }
            }
        }

        // 开始推理
        async function startInference() {
            if (!currentFile || !document.getElementById('modelSelect').value) {
                showToast('请选择模型和图片', 'error');
                return;
            }

            const modelPath = document.getElementById('modelSelect').value;
            const device = document.querySelector('.device-option.active').dataset.device;
            const conf = parseFloat(document.getElementById('confThreshold').value);
            const iou = parseFloat(document.getElementById('iouThreshold').value);
            const half = document.getElementById('halfPrecision').checked;

            const progress = document.getElementById('inferProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            document.getElementById('inferBtn').disabled = true;
            progress.classList.add('active');
            progressFill.style.width = '0%';

            try {
                const result = await API.inferImage(currentFile, {
                    model_path: modelPath,
                    confidence: conf,
                    iou_threshold: iou,
                    device: device,
                    half: half
                });

                if (result.success) {
                    currentResult = result;
                    displayResults(result);
                    showToast('推理完成!', 'success');
                } else {
                    showToast('推理失败: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('推理出错: ' + error.message, 'error');
            } finally {
                document.getElementById('inferBtn').disabled = false;
                progress.classList.remove('active');
            }
        }

        // 显示结果
        function displayResults(result) {
            // 显示统计信息
            document.getElementById('resultsStats').style.display = 'grid';
            document.getElementById('statTime').textContent = (result.inference_time * 1000).toFixed(1);
            document.getElementById('statCount').textContent = result.detections.length;

            const classes = new Set(result.detections.map(d => d.class_name));
            document.getElementById('statClasses').textContent = classes.size;
            document.getElementById('statImageSize').textContent = `${result.image_shape[1]}×${result.image_shape[0]}`;

            // 绘制检测结果
            drawResult();

            // 显示检测列表
            renderDetectionsList(result.detections);
        }

        // 绘制检测结果
        function drawResult() {
            const container = document.getElementById('previewContainer');
            const img = document.getElementById('previewImg');

            if (!img || !currentResult) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            ctx.drawImage(img, 0, 0);

            currentResult.detections.forEach((det, idx) => {
                const [x1, y1, x2, y2] = det.bbox;
                const color = COLORS[idx % COLORS.length];

                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                const label = `${det.class_name} ${(det.confidence * 100).toFixed(1)}%`;
                ctx.font = 'bold 14px Arial';
                const textWidth = ctx.measureText(label).width;

                ctx.fillStyle = color;
                ctx.fillRect(x1, y1 - 22, textWidth + 12, 22);
                ctx.fillStyle = 'white';
                ctx.fillText(label, x1 + 6, y1 - 6);
            });

            currentResult.canvasData = canvas;
            container.innerHTML = '';
            container.appendChild(canvas);
        }

        // 渲染检测列表
        function renderDetectionsList(detections) {
            const list = document.getElementById('detectionsList');
            if (detections.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">未检测到目标</p>';
                return;
            }

            list.innerHTML = detections.map((det, idx) => {
                const color = COLORS[idx % COLORS.length];
                return `
                    <div class="detection-item" style="border-left-color: ${color};">
                        <div class="color-dot" style="background: ${color};"></div>
                        <div class="detection-info">
                            <div class="detection-name">${det.class_name}</div>
                            <div class="detection-meta">坐标: [${det.bbox.map(v => v.toFixed(0)).join(', ')}]</div>
                        </div>
                        <span class="detection-conf">${(det.confidence * 100).toFixed(1)}%</span>
                    </div>
                `;
            }).join('');
        }

        // 清除结果
        function clearResults() {
            currentResult = null;
            document.getElementById('resultsStats').style.display = 'none';
            document.getElementById('detectionsList').innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">暂无检测结果</p>';
            previewImage(currentFile);
        }

        // 导出结果
        function exportResults() {
            if (!currentResult) {
                showToast('没有可导出的结果', 'error');
                return;
            }

            const exportData = {
                timestamp: new Date().toISOString(),
                inference_time: currentResult.inference_time,
                image_shape: currentResult.image_shape,
                detections: currentResult.detections
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `detection_results_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            showToast('结果已导出', 'success');
        }

        // 摄像头功能
        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = cameraStream;
                video.autoplay = true;
                document.getElementById('cameraPreview').innerHTML = '';
                document.getElementById('cameraPreview').appendChild(video);
            } catch (error) {
                showToast('无法访问摄像头: ' + error.message, 'error');
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        // 工具函数
        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
