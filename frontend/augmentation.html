<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据增强 - OpenCV Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="/static/company-logo.png" alt="鑫恒福科技" style="height: 40px; object-fit: contain;">
                <a href="/" class="navbar-brand">OpenCV Platform</a>
            </div>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">首页</a></li>
                <li><a href="/inference" class="nav-link">模型推理</a></li>
                <li><a href="/training" class="nav-link">模型训练</a></li>
                <li><a href="/models" class="nav-link">模型管理</a></li>
                <li><a href="/datasets" class="nav-link">数据集</a></li>
                <li><a href="/annotation" class="nav-link">数据标注</a></li>
                <li><a href="/augmentation" class="nav-link active">数据增强</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="grid" style="grid-template-columns: 350px 1fr; gap: 1.5rem;">
            <!-- 左侧配置面板 -->
            <div>
                <!-- 数据集选择 -->
                <div class="card">
                    <div class="card-header">选择数据集</div>
                    <div class="form-group">
                        <label>目标数据集</label>
                        <select id="sourceDataset" onchange="onDatasetChange()">
                            <option value="">请选择数据集...</option>
                        </select>
                    </div>
                    <div id="datasetInfo" style="display: none; margin-top: 1rem;">
                        <div class="stat-card stat-card-info">
                            <div class="stat-value" id="sourceImageCount">0</div>
                            <div class="stat-label">原图数量</div>
                        </div>
                    </div>
                </div>

                <!-- 增强配置 -->
                <div class="card">
                    <div class="card-header card-header-flex">
                        <span>增强配置</span>
                        <button class="btn btn-ghost btn-xs" onclick="resetConfig()">重置</button>
                    </div>

                    <!-- 几何变换 -->
                    <div class="config-section">
                        <div class="config-section-title">几何变换</div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="horizontalFlip" checked>
                                <span>水平翻转</span>
                            </label>
                            <label class="config-checkbox">
                                <input type="checkbox" id="verticalFlip">
                                <span>垂直翻转</span>
                            </label>
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="rotate" checked>
                                <span>随机旋转</span>
                            </label>
                            <input type="number" id="rotateLimit" class="config-input" value="45" min="0" max="180" title="旋转角度限制">
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="scale" checked>
                                <span>随机缩放</span>
                            </label>
                            <input type="number" id="scaleRange" class="config-input" value="0.1" min="0" max="1" step="0.05" title="缩放范围">
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="translate">
                                <span>随机平移</span>
                            </label>
                            <input type="number" id="translateRange" class="config-input" value="0.1" min="0" max="1" step="0.05" title="平移范围">
                        </div>
                    </div>

                    <!-- 光照变换 -->
                    <div class="config-section">
                        <div class="config-section-title">光照变换</div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="brightnessContrast" checked>
                                <span>亮度/对比度</span>
                            </label>
                            <input type="number" id="brightnessRange" class="config-input" value="0.2" min="0" max="1" step="0.05" title="亮度范围">
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="hueSaturation" checked>
                                <span>色调/饱和度</span>
                            </label>
                            <input type="number" id="contrastRange" class="config-input" value="0.2" min="0" max="1" step="0.05" title="对比度范围">
                        </div>
                    </div>

                    <!-- 噪声变换 -->
                    <div class="config-section">
                        <div class="config-section-title">噪声与特效</div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="blur">
                                <span>模糊</span>
                            </label>
                            <input type="number" id="blurLimit" class="config-input" value="7" min="3" max="15" step="2" title="模糊核大小">
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="noise">
                                <span>高斯噪声</span>
                            </label>
                            <input type="number" id="noiseVar" class="config-input" value="25" min="5" max="100" step="5" title="噪声方差">
                        </div>
                        <div class="config-row">
                            <label class="config-checkbox">
                                <input type="checkbox" id="cutout">
                                <span>随机遮挡 (Cutout)</span>
                            </label>
                            <input type="number" id="cutoutNum" class="config-input" value="8" min="1" max="20" step="1" title="遮挡数量">
                        </div>
                    </div>

                    <!-- 输出设置 -->
                    <div class="config-section">
                        <div class="config-section-title">输出设置</div>
                        <div class="form-group">
                            <label>每张图片生成增强图数量</label>
                            <input type="range" id="numAugmented" min="1" max="10" value="5" oninput="updateRangeValue('numAugmented', this.value)">
                            <span class="range-value" id="numAugmentedValue">5</span>
                        </div>
                        <div class="form-group">
                            <label>输出格式</label>
                            <select id="outputFormat">
                                <option value="jpg">JPEG</option>
                                <option value="png">PNG</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block" onclick="startAugmentation()">
                        开始增强
                    </button>
                </div>
            </div>

            <!-- 右侧预览区域 -->
            <div>
                <!-- 增强预览 -->
                <div class="card">
                    <div class="card-header card-header-flex">
                        <span>增强预览</span>
                        <div class="card-actions">
                            <label class="btn btn-ghost btn-xs" style="cursor: pointer;">
                                上传图片
                                <input type="file" id="previewImage" accept="image/*" style="display: none;" onchange="loadPreviewImage(event)">
                            </label>
                            <button class="btn btn-ghost btn-xs" onclick="generatePreview()">刷新预览</button>
                        </div>
                    </div>
                    <div id="previewArea" class="preview-grid">
                        <div class="preview-placeholder">
                            <p>上传一张图片预览增强效果</p>
                            <button class="btn btn-primary" onclick="document.getElementById('previewImage').click()">
                                选择图片
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 增强结果 -->
                <div class="card" id="resultCard" style="display: none;">
                    <div class="card-header card-header-flex">
                        <span>增强结果</span>
                        <button class="btn btn-ghost btn-xs" onclick="closeResult()">关闭</button>
                    </div>
                    <div id="resultSummary" class="grid grid-4" style="margin-bottom: 1rem;">
                        <div class="stat-card stat-card-success">
                            <div class="stat-value" id="resultOriginal">0</div>
                            <div class="stat-label">原图数量</div>
                        </div>
                        <div class="stat-card stat-card-warning">
                            <div class="stat-value" id="resultAugmented">0</div>
                            <div class="stat-label">增强数量</div>
                        </div>
                        <div class="stat-card stat-card-info">
                            <div class="stat-value" id="resultOutput">-</div>
                            <div class="stat-label">输出数据集</div>
                        </div>
                        <div class="stat-card stat-card-neutral">
                            <div class="stat-value" id="resultTime">-</div>
                            <div class="stat-label">处理时间</div>
                        </div>
                    </div>
                    <div id="resultSamples"></div>
                </div>

                <!-- 增强数据集列表 -->
                <div class="card">
                    <div class="card-header card-header-flex">
                        <span>增强数据集列表</span>
                        <button class="btn btn-ghost btn-xs" onclick="loadAugmentedDatasets()">刷新</button>
                    </div>
                    <div id="augmentedDatasetsList">
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 进度模态框 -->
    <div class="modal-overlay" id="progressModal">
        <div class="modal">
            <div class="modal-header">
                <h3>正在处理中...</h3>
            </div>
            <div class="modal-body">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p id="progressText" style="text-align: center; margin-top: 1rem;">正在处理...</p>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        // 全局状态
        let sourceDatasets = [];
        let previewImageData = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSourceDatasets();
            loadAugmentedDatasets();
        });

        // 加载源数据集列表
        async function loadSourceDatasets() {
            try {
                const response = await fetch('/api/v1/datasets/list');
                const data = await response.json();

                if (data.success) {
                    sourceDatasets = data.datasets;
                    const select = document.getElementById('sourceDataset');
                    select.innerHTML = '<option value="">请选择数据集...</option>';

                    sourceDatasets.forEach(ds => {
                        const option = document.createElement('option');
                        option.value = ds.name;
                        option.textContent = `${ds.name} (${ds.num_images || 0}张图片)`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载数据集失败:', error);
            }
        }

        // 数据集选择变化
        function onDatasetChange() {
            const name = document.getElementById('sourceDataset').value;
            const infoDiv = document.getElementById('datasetInfo');

            if (name) {
                const ds = sourceDatasets.find(d => d.name === name);
                if (ds) {
                    document.getElementById('sourceImageCount').textContent = ds.num_images || 0;
                    infoDiv.style.display = 'block';
                }
            } else {
                infoDiv.style.display = 'none';
            }
        }

        // 加载预览图片
        function loadPreviewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImageData = e.target.result;
                renderPreviewImages(previewImageData, []);
            };
            reader.readAsDataURL(file);
        }

        // 生成预览
        async function generatePreview() {
            const fileInput = document.getElementById('previewImage');
            if (!fileInput.files[0] && !previewImageData) {
                showToast('请先上传一张图片', 'warning');
                return;
            }

            const formData = new FormData();
            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            } else {
                // Convert base64 to blob
                const blob = dataURLtoBlob(previewImageData);
                formData.append('file', blob, 'preview.jpg');
            }
            formData.append('num_previews', '4');

            try {
                const response = await fetch('/api/v1/augmentation/preview', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success && data.previews) {
                    renderPreviewImages(previewImageData, data.previews);
                } else {
                    showToast('预览生成失败', 'error');
                }
            } catch (error) {
                showToast('预览请求失败: ' + error.message, 'error');
            }
        }

        // 渲染预览图片
        function renderPreviewImages(original, previews) {
            const previewArea = document.getElementById('previewArea');
            let html = '';

            // 原图
            html += `<div class="preview-item">
                <img src="${original}" alt="原图">
                <div class="preview-label">原图</div>
            </div>`;

            // 增强预览
            previews.forEach((preview, i) => {
                if (preview.type !== 'original') {
                    html += `<div class="preview-item">
                        <img src="data:image/jpeg;base64,${preview.data}" alt="增强${i}">
                        <div class="preview-label">增强 ${i + 1}</div>
                    </div>`;
                }
            });

            previewArea.innerHTML = html;
        }

        // base64 转 blob
        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        // 获取增强配置
        function getAugmentationConfig() {
            return {
                horizontal_flip: document.getElementById('horizontalFlip').checked,
                vertical_flip: document.getElementById('verticalFlip').checked,
                rotate: document.getElementById('rotate').checked,
                rotate_limit: parseInt(document.getElementById('rotateLimit').value) || 45,
                scale: document.getElementById('scale').checked,
                scale_range: parseFloat(document.getElementById('scaleRange').value) || 0.1,
                translate: document.getElementById('translate').checked,
                translate_range: parseFloat(document.getElementById('translateRange').value) || 0.1,
                brightness_contrast: document.getElementById('brightnessContrast').checked,
                brightness_range: parseFloat(document.getElementById('brightnessRange').value) || 0.2,
                contrast_range: parseFloat(document.getElementById('contrastRange').value) || 0.2,
                hue_saturation: document.getElementById('hueSaturation').checked,
                blur: document.getElementById('blur').checked,
                blur_limit: parseInt(document.getElementById('blurLimit').value) || 7,
                noise: document.getElementById('noise').checked,
                noise_var: parseInt(document.getElementById('noiseVar').value) || 25,
                cutout: document.getElementById('cutout').checked,
                cutout_num: parseInt(document.getElementById('cutoutNum').value) || 8,
                num_augmented: parseInt(document.getElementById('numAugmented').value) || 5,
                output_format: document.getElementById('outputFormat').value
            };
        }

        // 开始增强
        async function startAugmentation() {
            const datasetName = document.getElementById('sourceDataset').value;
            if (!datasetName) {
                showToast('请选择数据集', 'warning');
                return;
            }

            const config = getAugmentationConfig();

            // 显示进度
            document.getElementById('progressModal').classList.add('active');
            updateProgress(0, '正在准备增强参数...');

            const params = new URLSearchParams();
            params.append('horizontal_flip', config.horizontal_flip);
            params.append('vertical_flip', config.vertical_flip);
            params.append('rotate', config.rotate);
            params.append('rotate_limit', config.rotate_limit);
            params.append('scale', config.scale);
            params.append('scale_range', config.scale_range);
            params.append('translate', config.translate);
            params.append('brightness_contrast', config.brightness_contrast);
            params.append('hue_saturation', config.hue_saturation);
            params.append('blur', config.blur);
            params.append('noise', config.noise);
            params.append('cutout', config.cutout);
            params.append('num_augmented', config.num_augmented);
            params.append('output_format', config.output_format);

            try {
                const response = await fetch(`/api/v1/datasets/${datasetName}/augment?${params}`, {
                    method: 'POST'
                });

                updateProgress(90, '正在保存结果...');

                const data = await response.json();

                document.getElementById('progressModal').classList.remove('active');

                if (data.success) {
                    showResult(data);
                    showToast('增强完成!', 'success');
                    loadAugmentedDatasets();
                } else {
                    showToast('增强失败: ' + data.message, 'error');
                }
            } catch (error) {
                document.getElementById('progressModal').classList.remove('active');
                showToast('增强失败: ' + error.message, 'error');
            }
        }

        // 更新进度
        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // 显示结果
        function showResult(data) {
            const resultCard = document.getElementById('resultCard');
            resultCard.style.display = 'block';

            document.getElementById('resultOriginal').textContent = data.data?.original_images || 0;
            document.getElementById('resultAugmented').textContent = data.data?.augmented_images || 0;
            document.getElementById('resultOutput').textContent = data.data?.output_dataset || '-';

            // 渲染样本
            const samples = data.data?.samples || [];
            const samplesHtml = samples.map(sample => `
                <div class="sample-item">
                    <div class="sample-pair">
                        <div class="sample-image">
                            <img src="/api/v1/datasets/${document.getElementById('sourceDataset').value}/thumbnails/${sample.original}" alt="原图" onerror="this.src='/static/placeholder.png'">
                            <span>原图</span>
                        </div>
                        <div class="sample-arrow">→</div>
                        <div class="sample-image">
                            <img src="/api/v1/datasets/${data.data.output_dataset}/thumbnails/${sample.augmented}" alt="增强图" onerror="this.src='/static/placeholder.png'">
                            <span>增强</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('resultSamples').innerHTML = samplesHtml || '<p>暂无样本数据</p>';
        }

        // 关闭结果
        function closeResult() {
            document.getElementById('resultCard').style.display = 'none';
        }

        // 加载增强数据集列表
        async function loadAugmentedDatasets() {
            try {
                const response = await fetch('/api/v1/datasets/augmented/list');
                const data = await response.json();

                const container = document.getElementById('augmentedDatasetsList');

                if (data.success && data.datasets && data.datasets.length > 0) {
                    container.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>名称</th>
                                    <th>原图</th>
                                    <th>增强图</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.datasets.map(ds => `
                                    <tr>
                                        <td><strong>${ds.name}</strong></td>
                                        <td>${ds.original_images}</td>
                                        <td>${ds.augmented_images}</td>
                                        <td>${formatDate(ds.created_at)}</td>
                                        <td>
                                            <button class="btn btn-ghost btn-xs" onclick="viewDatasetStats('${ds.name}')">
                                                统计
                                            </button>
                                            <button class="btn btn-ghost btn-xs" onclick="useAsSource('${ds.name}')">
                                                作为源数据
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: var(--secondary-color);">
                            暂无增强数据集
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载增强数据集失败:', error);
                document.getElementById('augmentedDatasetsList').innerHTML =
                    '<p style="color: var(--danger-color);">加载失败</p>';
            }
        }

        // 查看数据集统计
        function viewDatasetStats(name) {
            window.location.href = `/datasets?highlight=${name}`;
        }

        // 作为源数据使用
        function useAsSource(name) {
            // 添加到下拉框并选中
            const select = document.getElementById('sourceDataset');
            let option = select.querySelector(`option[value="${name}"]`);

            if (!option) {
                option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} (从增强数据集中选择)`;
                select.appendChild(option);
            }

            select.value = name;
            onDatasetChange();
            showToast(`已选择 "${name}" 作为源数据集`, 'success');
        }

        // 重置配置
        function resetConfig() {
            document.getElementById('horizontalFlip').checked = true;
            document.getElementById('verticalFlip').checked = false;
            document.getElementById('rotate').checked = true;
            document.getElementById('rotateLimit').value = 45;
            document.getElementById('scale').checked = true;
            document.getElementById('scaleRange').value = 0.1;
            document.getElementById('translate').checked = false;
            document.getElementById('brightnessContrast').checked = true;
            document.getElementById('brightnessRange').value = 0.2;
            document.getElementById('contrastRange').value = 0.2;
            document.getElementById('hueSaturation').checked = true;
            document.getElementById('blur').checked = false;
            document.getElementById('noise').checked = false;
            document.getElementById('cutout').checked = false;
            document.getElementById('numAugmented').value = 5;
            document.getElementById('outputFormat').value = 'jpg';
            updateRangeValue('numAugmented', 5);
            showToast('配置已重置', 'info');
        }

        // 更新范围值显示
        function updateRangeValue(id, value) {
            document.getElementById(id + 'Value').textContent = value;
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN');
        }

        // 显示提示
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

    <style>
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            min-height: 300px;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .preview-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.5rem;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 0.85rem;
        }

        .preview-placeholder {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--secondary-color);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
        }

        .preview-placeholder p {
            margin-bottom: 1rem;
        }

        .config-section {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .config-section:last-of-type {
            border-bottom: none;
        }

        .config-section-title {
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--dark-color);
            font-size: 0.9rem;
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .config-checkbox {
            display: flex;
