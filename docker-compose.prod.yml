services:
  # PostgreSQL 数据库 (支持 pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opencv-postgres
    environment:
      POSTGRES_DB: opencv_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencv-network
    restart: unless-stopped

  # MinIO S3 兼容存储
  minio:
    image: minio/minio:latest
    container_name: opencv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - opencv-network
    restart: unless-stopped

  # OpenCV Platform 应用
  opencv-platform:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: opencv-platform:latest
    container_name: opencv-platform-prod
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - APP_NAME=OpenCV Platform
      - APP_VERSION=2.1.0
      - DEBUG=False
      - API_PORT=8000
      - DATA_DIR=/app/data
      - DATASETS_DIR=/app/data/datasets
      - MODELS_DIR=/app/data/models
      - EXPORTS_DIR=/app/data/exports
      - UPLOADS_DIR=/app/data/uploads
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

      # PostgreSQL 配置
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=opencv_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}

      # S3/MinIO 配置
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=opencv-platform
      - STORAGE_BACKEND=s3

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped
    networks:
      - opencv-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  opencv-network:
    driver: bridge
    ipam:
      config:
        # 避免与机器上已有 172.28.x Docker 网段冲突
        - subnet: 172.30.0.0/16
