services:
  opencv-platform:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: opencv-platform:latest
    container_name: opencv-platform-prod
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - APP_NAME=OpenCV Platform
      - APP_VERSION=2.1.0
      - DEBUG=False
      - API_PORT=8000
      - DATA_DIR=/app/data
      - DATASETS_DIR=/app/data/datasets
      - MODELS_DIR=/app/data/models
      - EXPORTS_DIR=/app/data/exports
      - UPLOADS_DIR=/app/data/uploads
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped
    networks:
      - opencv-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  opencv-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
