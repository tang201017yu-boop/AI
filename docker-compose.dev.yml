services:
  opencv-platform-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencv-platform:dev
    container_name: opencv-platform-dev
    ports:
      - "8000:8000"

    volumes:
      # 挂载应用代码（代码修改立即生效）
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./config:/app/config
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts

      # 挂载数据和日志目录
      - ./data:/app/data
      - ./logs:/app/logs

      # 挂载环境变量（只读）
      - ./.env:/app/.env:ro

    environment:
      APP_NAME: "OpenCV Platform (Dev)"
      APP_VERSION: "2.1.0-dev"
      DEBUG: "True"
      API_PORT: 8000
      DATA_DIR: /app/data
      DATASETS_DIR: /app/data/datasets
      MODELS_DIR: /app/data/models
      EXPORTS_DIR: /app/data/exports
      UPLOADS_DIR: /app/data/uploads
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      RELOAD: "True"

    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-dir /app/frontend
      --log-level info

    networks:
      - opencv-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

networks:
  opencv-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
